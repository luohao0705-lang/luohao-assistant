[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luohao-assistant-api"
version = "0.1.0"
description = "Single-user entrepreneur operations assistant API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-jose[cryptography]>=3.3,<4",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["."]

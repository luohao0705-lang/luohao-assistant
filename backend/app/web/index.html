<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="财务驾驶舱">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="洛浩私人财务驾驶舱">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/finance-assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/finance-assets/styles.css">
  <title>财务驾驶舱</title>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <main class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 17.5V10m5 7.5V6m5 11.5v-4m5 4V3"/></svg>
      </div>
      <p class="login-kicker">私人财务驾驶舱</p>
      <h1 id="login-title">看清数字，再做决定</h1>
      <p class="login-copy">数据只在登录后显示。退出页面会自动锁定。</p>
      <form id="login-form" novalidate>
        <label for="password">访问密码</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="请输入 8 位数字" aria-describedby="login-hint login-error">
          <button id="password-toggle" class="icon-button" type="button" aria-label="显示密码">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
        <p id="login-hint" class="field-hint">请输入你的数字访问密码</p>
        <p id="login-error" class="form-error" role="alert"></p>
        <button id="login-button" class="primary-button" type="submit" disabled>进入驾驶舱</button>
      </form>
      <p class="privacy-line">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        连接已加密，财务内容不会出现在系统通知中
      </p>
    </main>
  </div>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="desktop-sidebar" aria-label="主导航">
      <div class="sidebar-brand">
        <span class="brand-mark small" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17.5V10m5 7.5V6m5 11.5v-4m5 4V3"/></svg></span>
        <span><strong>洛浩</strong><small>财务驾驶舱</small></span>
      </div>
      <nav id="desktop-nav" class="desktop-nav"></nav>
      <button class="sidebar-lock" data-action="lock">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        锁定
      </button>
    </aside>

    <div class="app-content">
      <header class="topbar">
        <div>
          <p id="page-kicker" class="page-kicker"></p>
          <h1 id="page-title">财务助理</h1>
        </div>
        <div class="topbar-actions">
          <span id="connection-status" class="connection-status"><i></i>连接中</span>
          <button class="icon-button" data-action="refresh" aria-label="刷新数据">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6 6.5L4 11m2 4a7 7 0 0 0 12 2.5l2-4.5"/></svg>
          </button>
          <button class="icon-button mobile-lock" data-action="lock" aria-label="锁定">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
      <nav id="mobile-nav" class="mobile-nav" aria-label="主导航"></nav>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/finance-assets/app.js" defer></script>
</body>
</html>

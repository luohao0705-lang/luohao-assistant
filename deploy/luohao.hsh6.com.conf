server {
    listen 80;
    server_name luo.hsh6.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/luo.hsh6.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name luo.hsh6.com;
    ssl_certificate     /www/server/panel/vhost/letsencrypt/luo.hsh6.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/luo.hsh6.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
